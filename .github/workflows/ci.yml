name: Windows native CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Build and test native release
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Verify packaged native executables
        shell: pwsh
        run: |
          $required = 'OpenGuard.exe','OpenGuardCLI.exe','OpenGuardService.exe','OpenGuardScanner.exe','OpenGuardETW.exe'
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path 'dist\OpenGuard' $name))) { throw "Missing $name" }
          }
          $python = Get-ChildItem -LiteralPath 'dist\OpenGuard' -Recurse -File | Where-Object { $_.Extension -in '.py','.pyw','.pyc','.pyd' -or $_.Name -match 'python|pyinstaller' }
          if ($python) { throw "Python artifacts found: $($python.FullName -join ', ')" }
          ./dist/OpenGuard/OpenGuardCLI.exe protocol-fixture --pretty

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenGuard-win-x64
          path: |
            release/*
          if-no-files-found: error
          retention-days: 14
