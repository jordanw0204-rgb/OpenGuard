name: Windows CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install pinned build dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Check native API health
        shell: pwsh
        run: python openguard_cli.py doctor --pretty

      - name: Build portable release
        shell: pwsh
        run: ./scripts/build.ps1 -SkipTests

      - name: Smoke-test packaged CLI
        shell: pwsh
        run: ./dist/OpenGuard/OpenGuardCLI.exe doctor --pretty

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenGuard-win-x64
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          retention-days: 14
