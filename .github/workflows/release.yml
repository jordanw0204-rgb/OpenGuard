name: Tagged native release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Prepare optional Authenticode certificate
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
        run: |
          if ($env:SIGNING_CERT_BASE64) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\openguard-signing.pfx", [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          }

      - name: Test and build native release
        shell: pwsh
        env:
          OPENGUARD_SIGN_PFX: ${{ runner.temp }}\openguard-signing.pfx
          OPENGUARD_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: ./scripts/build.ps1

      - name: Classify release trust
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "$env:RUNNER_TEMP\openguard-signing.pfx") {
            'OPENGUARD_RELEASE_PRERELEASE=false' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            'OPENGUARD_RELEASE_PRERELEASE=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Publish GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath 'release' -File | Select-Object -ExpandProperty FullName
          if (-not $assets) { throw 'No release assets were produced.' }
          $arguments = @('release', 'create', $env:GITHUB_REF_NAME) + $assets + @('--verify-tag', '--generate-notes')
          if ($env:OPENGUARD_RELEASE_PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
            $arguments += '--notes'
            $arguments += 'Unsigned development release: no CA-issued Windows code-signing certificate was configured. Verify the published SHA-256 files before testing.'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed with exit code $LASTEXITCODE" }
