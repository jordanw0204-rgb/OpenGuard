[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openguard"
version = "0.2.0"
description = "Transparent, local-first Windows process/network monitor and security scanner"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "OpenGuard contributors" }]
keywords = ["windows", "security", "antivirus", "process-monitor", "network-monitor"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "cryptography==50.0.0",
  "yara-x==1.19.0",
]

[project.scripts]
openguard = "openguard.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openguard = ["data/*.json", "data/*.txt", "data/*.yar"]
